body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums}
main{max-width:1060px;margin:0 auto;padding:20px 16px 48px}
h1{font:600 28px/1.15 Fraunces,Georgia,serif;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 18px;max-width:62ch}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:14px}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mute);gap:3px}
select,input[type=number],button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 9px}
input[type=number]{width:70px}
button{cursor:pointer}button:hover{border-color:var(--acc)}button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.sp{flex:1}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kpi div{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:6px;padding:10px 12px}
.kpi b{display:block;font-size:26px;line-height:1.1}.kpi span{font-size:13px;color:var(--mute)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:8px 14px;color:var(--mute)}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--acc);font-weight:600}
.w{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:14px}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--mute);font-weight:500;background:var(--bg)}
tr:last-child td{border-bottom:0}
.wk td{background:var(--sb);font-weight:600;font-size:13px}
.b{display:inline-block;border-radius:4px;padding:1px 8px;font-size:12.5px;font-weight:600}
.K{background:var(--kb);color:var(--k)}.T{background:var(--tb);color:var(--t)}.S{background:var(--sb);color:var(--s)}
.mt{color:var(--mute);font-size:13px}
details{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:8px;padding:0 14px}
summary{cursor:pointer;padding:11px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
details[open] summary{border-bottom:1px solid var(--line);margin-bottom:8px}
details ul{margin:0 0 12px;padding-left:20px}details li{margin:3px 0;max-width:80ch}
.bars div{display:grid;grid-template-columns:150px 1fr 40px;gap:10px;align-items:center;margin:6px 0}
.bars i{display:block;height:14px;background:var(--acc);border-radius:2px}
.note{font-size:13px;color:var(--mute);margin-top:14px;max-width:80ch}
.empty{padding:28px;text-align:center;color:var(--mute)}
@media print{.bar,.tabs,.note{display:none}body{background:#fff}}

function cat(c,k){if(/LAYANG/.test(c+k))return'Layangan';if(c=='POHON')return'Vegetasi';if(c=='BINATANG')return'Satwa';if(/KOMPONEN|PERALATAN|TIANG/.test(c))return'Komponen';if(/PIHAK/.test(c))return'Pihak ketiga';return'Belum ditemukan'}

function plan(){
 const [y,m]=$('mo').value.split('-').map(Number),tim=+$('tim').value||1,uf=$('ulp').value;
 const rows=R.filter(r=>r.y==y&&r.m==m&&(uf=='ALL'||r.ulp==uf));
 const g={};
 rows.forEach(r=>{const k=r.ulp+'|'+r.key;const o=g[k]=g[k]||{ulp:r.ulp,key:r.key,pen:r.pen,n:0,p:0,kw:0,min:0,cs:{},kt:{}};
  o.n++;if(r.j=='P')o.p++;o.kw=Math.max(o.kw,r.kw);o.min+=r.min;const c=cat(r.c,r.ket);o.cs[c]=(o.cs[c]||0)+1;if(r.ket)o.kt[r.ket]=1});
 const items=Object.values(g).map(o=>{
  o.cat=ORD.slice().sort((a,b)=>(o.cs[b]||0)-(o.cs[a]||0))[0];
  o.score=+(o.n+2*o.p+Math.min(o.kw/60,2)+(o.min>=30?1:0)).toFixed(1);
  o.lv=o.score>=8?'K':o.score>=4?'T':'S';
  const r=ACT[o.cat].rec.slice();
  Object.keys(o.cs).filter(c=>c!=o.cat).forEach(c=>r.push('Tambahan ('+c.toLowerCase()+', '+o.cs[c]+'x): '+ACT[c].job.toLowerCase()));
  if(/^REC_/.test(o.key)&&o.n>=5)r.push('Evaluasi setelan recloser dan koordinasi dengan relay penyulang GI (kurva, jumlah reclose)');
  if(o.p>0)r.push('Siapkan material cadangan dan evaluasi segmentasi LBS/sectionalizer agar isolasi gangguan permanen lebih cepat');
  o.rec=r;return o}).sort((a,b)=>b.score-a.score);
 const sched=items.filter(o=>o.score>=3),watch=items.filter(o=>o.score<3);
 const ty=m==12?y+1:y,tm=m%12,nd=new Date(Date.UTC(ty,tm+1,0)).getUTCDate(),wd=[];
 for(let d=1;d<=nd;d++)if(new Date(Date.UTC(ty,tm,d)).getUTCDay()!=0)wd.push(d);
 const cnt={};
 sched.forEach(o=>{const k=cnt[o.ulp]=(cnt[o.ulp]||0);const i=Math.floor(k/tim);o.day=wd[Math.min(i,wd.length-1)];o.over=i>=wd.length;cnt[o.ulp]++});
 return{rows,items,sched,watch,ty,tm,y,m}}
function render(){

  s.forEach(o=>{const dow=new Date(Date.UTC(P.ty,P.tm,o.day)).getUTCDay(),w=Math.ceil((o.day+new Date(Date.UTC(P.ty,P.tm,1)).getUTCDay())/7);
   if(w!=wk){wk=w;h+='<tr class="wk"><td colspan="5">Minggu '+w+'</td></tr>'}
   h+='<tr><td>'+HR[dow]+', '+o.day+' '+BL[P.tm].slice(0,3)+(o.over?' <span class="mt">(kapasitas penuh)</span>':'')+'</td><td>'+esc(o.ulp)+'</td><td><b>'+esc(o.key)+'</b><div class="mt">'+esc(o.pen)+'</div></td><td>'+ACT[o.cat].job+'</td><td><span class="b '+o.lv+'">'+lv[o.lv]+'</span><div class="mt">'+dasar(o)+'</div></td></tr>'});
  V.innerHTML='<div class="w"><table><thead><tr><th>Tanggal</th><th>ULP</th><th>Lokasi</th><th>Pekerjaan</th><th>Prioritas dan dasar</th></tr></thead><tbody>'+h+'</tbody></table></div><button id="cp" class="p">Salin jadwal ke Excel</button> <button onclick="print()">Cetak</button>'+
  (P.watch.length?'<p class="note">'+P.watch.length+' titik lain hanya satu atau dua gangguan sementara dan tidak dijadwalkan. Pantau pada patroli rutin: '+P.watch.slice(0,6).map(o=>esc(o.key)).join(', ')+(P.watch.length>6?', dan lainnya.':'.')+'</p>':'');
  $('cp').onclick=()=>{const t=['Tanggal\tULP\tPenyulang\tKeypoint\tPekerjaan\tPrioritas\tDasar'].concat(s.map(o=>[o.day+' '+BL[P.tm]+' '+P.ty,o.ulp,o.pen,o.key,ACT[o.cat].job,lv[o.lv],dasar(o)].join('\t'))).join('\n');

 }else if(tab=='r'){
  V.innerHTML=P.items.filter(o=>o.score>=3).map(o=>'<details><summary><span class="b '+o.lv+'">'+lv[o.lv]+'</span><b>'+esc(o.key)+'</b><span class="mt">'+esc(o.ulp)+' · '+esc(o.pen)+' · '+dasar(o)+'</span></summary><p class="mt" style="margin:0 0 6px">Penyebab dominan: '+o.cat.toLowerCase()+(Object.keys(o.kt).length?'. Temuan: '+esc(Object.keys(o.kt).slice(0,3).join('; ').toLowerCase()):'')+'</p><ul>'+o.rec.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></details>').join('')||'<div class="empty">Belum ada titik yang memenuhi ambang jadwal.</div>'
 }else{
  const c={};P.rows.forEach(r=>{const k=cat(r.c,r.ket);c[k]=(c[k]||0)+1});const mx=Math.max(...Object.values(c));
  const u={};P.rows.forEach(r=>{u[r.ulp]=(u[r.ulp]||0)+1});
  V.innerHTML='<div class="w" style="padding:8px 14px"><div class="bars">'+Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([k,v])=>'<div><span>'+k+'</span><i style="width:'+v/mx*100+'%"></i><b>'+v+'</b></div>').join('')+'</div></div><div class="w"><table style="min-width:0"><thead><tr><th>ULP</th><th>Gangguan</th><th>Permanen</th></tr></thead><tbody>'+Object.entries(u).sort((a,b)=>b[1]-a[1]).map(([k,v])=>'<tr><td>'+esc(k)+'</td><td>'+v+'</td><td>'+P.rows.filter(r=>r.ulp==k&&r.j=='P').length+'</td></tr>').join('')+'</tbody></table></div>'}
